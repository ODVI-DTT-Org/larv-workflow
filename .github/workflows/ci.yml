name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats
      - name: Validate plugin manifest
        run: jq empty .claude-plugin/plugin.json
      - name: Run all bats tests
        run: bats tests/
      - name: Validate STATE.yaml fixtures
        run: |
          for f in tests/fixtures/state-*.yaml; do
            yq empty "$f"
          done

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          find scripts/ migrations/ -name '*.sh' -print0 | xargs -0 shellcheck -e SC2155 -e SC1091
